<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Royal Purple Gradients (No Glowing) -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
  </defs>

  <!-- 1. The House: Architectural Gable & Body -->
  <!-- Chimney -->
  <rect x="340" y="80" width="34" height="60" rx="4" fill="#5B21B6" />
  
  <!-- House Outer Gable / Roof -->
  <path d="M256 42 L452 195 L404 195 L404 380 C404 392 394 402 382 402 L130 402 C118 402 108 392 108 380 L108 195 L60 195 Z" 
        fill="url(#houseGrad)" 
        stroke="#8B5CF6" 
        stroke-width="7" 
        stroke-linejoin="round" />

  <!-- Inner Architectural Arch / Doorway framing the Legal Symbol -->
  <path d="M150 398 L150 220 C150 162 196 116 256 116 C316 116 362 162 362 220 L362 398 Z" 
        fill="#1E1238" 
        stroke="#A78BFA" 
        stroke-width="3.5" 
        opacity="0.95" />

  <!-- 2. The Legal Symbol: Scales of Justice inside the House -->
  <!-- Center Pillar -->
  <rect x="250" y="140" width="12" height="200" rx="6" fill="url(#metalGrad)" />
  <circle cx="256" cy="132" r="14" fill="url(#goldGrad)" stroke="#F5F3FF" stroke-width="2" />
  
  <!-- Pedestal Base -->
  <rect x="216" y="336" width="80" height="12" rx="6" fill="url(#goldGrad)" />
  <rect x="230" y="324" width="52" height="12" rx="4" fill="url(#metalGrad)" />

  <!-- Balance Beam -->
  <path d="M156 172 C190 164 224 162 256 162 C288 162 322 164 356 172" 
        fill="none" 
        stroke="url(#metalGrad)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Left Scale Pan & Strings -->
  <line x1="174" y1="172" x2="148" y2="236" stroke="#DDD6FE" stroke-width="2.5" />
  <line x1="174" y1="172" x2="200" y2="236" stroke="#DDD6FE" stroke-width="2.5" />
  <path d="M136 236 C136 258 212 258 212 236 Z" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Right Scale Pan & Strings (Balanced Equilibrium) -->
  <line x1="338" y1="172" x2="312" y2="236" stroke="#DDD6FE" stroke-width="2.5" />
  <line x1="338" y1="172" x2="364" y2="236" stroke="#DDD6FE" stroke-width="2.5" />
  <path d="M300 236 C300 258 376 258 376 236 Z" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="1.5" />

  <!-- Subtle Tenant Protection Star on Roof Ridge -->
  <path d="M256 64 L260 74 L270 74 L262 80 L265 90 L256 84 L247 90 L250 80 L242 74 L252 74 Z" fill="#FDE68A" />

  <!-- 3. Three Words Underneath: DEFEND • RECOVER • ENFORCE -->
  <rect x="70" y="438" width="372" height="42" rx="21" fill="#130C24" stroke="#8B5CF6" stroke-width="2" />
  
  <text x="256" y="465" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="14.5" 
        font-weight="800" 
        letter-spacing="4.5" 
        fill="#DDD6FE">
    DEFEND • RECOVER • ENFORCE
  </text>
</svg>
